# Hand-edited part of the progress diagram. tools/progress.py reads this file, the sources and the committed
# dEQP results, and writes docs/progress.svg and docs/progress.md.
#
# Rules
#  * Never mark an item "done" without evidence. Evidence is "path" or "path#token" (the file must exist in this
#    tree and, with a token, contain it). tools/progress.py refuses a "done" item with no verifiable evidence.
#  * "branch:<name>" evidence (work not merged to main) can only back "partial".
#  * When unsure: "partial" or "none".
#  * Vulkan core features and DXVK extensions are NOT listed here. They come from vk/tests/t_dxvk_caps.c (the list)
#    and vk/src/mali_physical_device.c (what is advertised), cross-checked with DXVK_MISSING in vk/check.sh.
#    Only downgrades/upgrades of those items go in [override].
#  * Roadmap stages R0-R7 come from the table in ROADMAP.md. Only the extra milestones are listed here.

# --- GPU generations: bring-up ladder -------------------------------------------------------------------------
# Shared evidence per rung (the test that exercises it). Hardware rungs also use the GPU's own dEQP sample file.
[[ladder]]
id = "probe"
label = "GPU id and uAPI probe"
ev = ["libkbase/src/ctx.c"]

[[ladder]]
id = "submit"
label = "Submit and fences"
ev = ["vk/tests/t_queue.c"]

[[ladder]]
id = "device"
label = "ICD enumerates, creates a device"
ev = ["vk/tests/t_icd.c", "vk/check.sh#direct v11"]

[[ladder]]
id = "draw"
label = "Graphics draw"
ev = ["vk/tests/t_vk_draw.c"]

[[ladder]]
id = "compute"
label = "Compute"
ev = ["vk/tests/t_vk_compute.c"]

[[ladder]]
id = "meta"
label = "Copy, blit, clear, queries"
ev = ["vk/tests/t_vk_meta.c", "vk/tests/t_query.c"]

[[ladder]]
id = "wsi"
label = "Present through WSI"
ev = ["vk/tests/t_vk_present.c"]

[[ladder]]
id = "deqp"
label = "dEQP-VK daily sample runs"
ev = ["vk/deqp/qdeqp.py"]

# status per rung: done | partial | none. "tsv" names the committed vk/deqp/ours-daily-sample-<tsv>.tsv.
[[gpu]]
id = "v10"
name = "Mali-G610"
arch = "v10"
branch = "feat/v10"          # not merged to main: every rung is at most partial here
tsv = ""
probe = "partial"
submit = "partial"
device = "partial"
draw = "partial"
compute = "partial"
meta = "partial"
wsi = "none"
deqp = "partial"
note = "bring-up on branch feat/v10 (unmerged): ladder passes through the ICD on hardware, dEQP sample 302 pass in the branch notes"

[[gpu]]
id = "v11"
name = "Mali-G615"
arch = "v11"
tsv = "cmf"
probe = "done"
submit = "done"
device = "done"
draw = "done"
compute = "done"
meta = "done"
wsi = "done"
deqp = "done"
note = "the reference GPU"

[[gpu]]
id = "v13"
name = "Mali-G925"
arch = "v13"
tsv = "poco"
probe = "done"
submit = "done"
device = "done"
draw = "done"
compute = "done"
meta = "partial"             # README: meta ops hardware-tested on v11, partial elsewhere
wsi = "partial"              # README: WSI passed on v11, v13 pending
deqp = "done"
note = "fewer hours of testing than v11"

